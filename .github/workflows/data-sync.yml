name: Validated data snapshots
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [all, events, rankings, pandascore-review]
        default: all
  schedule:
    - cron: "23 */6 * * *"
    - cron: "17 */6 * * *"
    - cron: "41 3 * * *"
permissions:
  contents: read
concurrency:
  group: orbital-data-sync
  cancel-in-progress: false
jobs:
  pandascore-review:
    if: inputs.kind == 'pandascore-review' || github.event.schedule == '23 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare PandaScore candidate review
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
        run: npm run data:pandascore:review
      - name: Upload PandaScore candidate review
        uses: actions/upload-artifact@v4
        with:
          name: pandascore-candidates-review-required
          path: screenshots/pandascore-review.json
          if-no-files-found: error
          retention-days: 7
  prepare:
    # Explicit opt-in after source contracts, credentials and coverage are verified.
    if: vars.ORBITAL_SYNC_ENABLED == 'true' && inputs.kind != 'pandascore-review' && github.event.schedule != '23 */6 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fetch and validate normalized feeds
        env:
          ORBITAL_EVENTS_FEED_URL: ${{ vars.ORBITAL_EVENTS_FEED_URL }}
          ORBITAL_RANKINGS_FEED_URL: ${{ vars.ORBITAL_RANKINGS_FEED_URL }}
          ORBITAL_EVENTS_FEED_TOKEN: ${{ secrets.ORBITAL_EVENTS_FEED_TOKEN }}
          ORBITAL_RANKINGS_FEED_TOKEN: ${{ secrets.ORBITAL_RANKINGS_FEED_TOKEN }}
          REQUESTED_KIND: ${{ inputs.kind }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          kind="${REQUESTED_KIND:-all}"
          if [ "$SCHEDULE" = '17 */6 * * *' ]; then kind=events; fi
          if [ "$SCHEDULE" = '41 3 * * *' ]; then kind=rankings; fi
          if [ "$kind" != rankings ] && [ -z "$ORBITAL_EVENTS_FEED_URL" ]; then echo 'Event feed is not configured'; exit 1; fi
          if [ "$kind" != events ] && [ -z "$ORBITAL_RANKINGS_FEED_URL" ]; then echo 'Ranking feed is not configured'; exit 1; fi
          npm run data:sync -- "$kind"
      - run: npm run test:data
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: validated-data-snapshots
          path: src/data/sync/
      - name: Publish verified snapshot to the repository
        # A second explicit gate separates source testing from publication.
        if: vars.ORBITAL_SYNC_PUBLISH == 'true'
        run: |
          git config user.name 'orbital-data-sync[bot]'
          git config user.email 'orbital-data-sync[bot]@users.noreply.github.com'
          git add src/data/sync/current.json src/data/sync/history/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: publish validated esports snapshot'
          git push origin HEAD:${{ github.event.repository.default_branch }}
